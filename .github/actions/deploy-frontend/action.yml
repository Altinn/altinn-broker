name: Deploy frontend

description: "Build the React app and deploy static assets to Azure Storage behind Azure Front Door"

inputs:
  region:
    description: "Azure region to deploy to"
    required: true
  environment:
    description: "Github environment to deploy from"
    required: true
  AZURE_NAME_PREFIX:
    description: "Prefix for all resources"
    required: true
  AZURE_CLIENT_ID:
    description: "Client ID for the service principal"
    required: true
  AZURE_TENANT_ID:
    description: "Tenant ID for the service principal"
    required: true
  AZURE_SUBSCRIPTION_ID:
    description: "Subscription ID for the service principal"
    required: true
  FRONTEND_STORAGE_ACCOUNT:
    description: "Globally unique storage account name for the frontend static website"
    required: true
  API_ORIGIN_HOST_NAME:
    description: "APIM gateway hostname (e.g. altinn-dev-api.azure-api.net). Front Door forwards /broker/* here. Leave empty for SPA-only Front Door."
    required: false
    default: ""
  VITE_API_BASE_URL:
    description: "Broker API origin baked into the SPA at build time. Leave empty when Front Door proxies /broker/* (same-origin cookies)."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: frontend
      run: npm ci

    - name: Build frontend
      shell: bash
      working-directory: frontend
      env:
        VITE_API_BASE_URL: ${{ inputs.VITE_API_BASE_URL }}
      run: npm run build

    - name: OIDC Login to Azure Public Cloud
      uses: azure/login@v3
      with:
        client-id: ${{ inputs.AZURE_CLIENT_ID }}
        tenant-id: ${{ inputs.AZURE_TENANT_ID }}
        subscription-id: ${{ inputs.AZURE_SUBSCRIPTION_ID }}

    - name: Resolve deployment principal object ID
      shell: bash
      run: |
        set -euo pipefail
        OBJECT_ID="$(az ad sp show --id "${{ inputs.AZURE_CLIENT_ID }}" --query id -o tsv)"
        echo "DEPLOYMENT_PRINCIPAL_OBJECT_ID=$OBJECT_ID" >> "$GITHUB_ENV"

    - name: Deploy frontend infrastructure
      uses: azure/arm-deploy@v2
      id: deploy
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        NAME_PREFIX: ${{ inputs.AZURE_NAME_PREFIX }}
        DEPLOYMENT_PRINCIPAL_OBJECT_ID: ${{ env.DEPLOYMENT_PRINCIPAL_OBJECT_ID }}
        FRONTEND_STORAGE_ACCOUNT: ${{ inputs.FRONTEND_STORAGE_ACCOUNT }}
        API_ORIGIN_HOST_NAME: ${{ inputs.API_ORIGIN_HOST_NAME }}
      with:
        scope: subscription
        subscriptionId: ${{ inputs.AZURE_SUBSCRIPTION_ID }}
        resourceGroupName: ${{ inputs.AZURE_NAME_PREFIX }}-rg
        template: ./.azure/applications/frontend/main.bicep
        deploymentMode: Incremental
        deploymentName: ${{ inputs.AZURE_NAME_PREFIX }}-frontend-${{ github.run_id }}
        region: ${{ inputs.region }}
        failOnStdErr: false
        parameters: ./.azure/applications/frontend/params.bicepparam

    - name: Enable static website and upload assets
      shell: bash
      run: |
        set -euo pipefail
        STORAGE_ACCOUNT="${{ inputs.FRONTEND_STORAGE_ACCOUNT }}"
        for attempt in {1..6}; do
          if az storage blob service-properties update \
            --account-name "$STORAGE_ACCOUNT" \
            --static-website \
            --index-document index.html \
            --404-document index.html \
            --auth-mode login \
          && az storage blob upload-batch \
            --account-name "$STORAGE_ACCOUNT" \
            --destination '$web' \
            --source ./frontend/dist \
            --overwrite \
            --auth-mode login; then
            exit 0
          fi
          if [ "$attempt" -eq 6 ]; then
            echo "Failed to enable static website and upload assets after $attempt attempts."
            exit 1
          fi
          echo "Storage data-plane call failed, waiting for RBAC propagation (attempt $attempt/6)..."
          sleep 30
        done

    - name: Purge Front Door cache
      shell: bash
      run: |
        set -euo pipefail
        az afd endpoint purge \
          --resource-group "${{ steps.deploy.outputs.resourceGroupName }}" \
          --profile-name "${{ steps.deploy.outputs.frontDoorProfileName }}" \
          --endpoint-name "${{ steps.deploy.outputs.frontDoorEndpointName }}" \
          --content-paths '/*'

    - name: Log deployment URL
      shell: bash
      run: |
        echo "Frontend deployed to https://${{ steps.deploy.outputs.frontDoorEndpointHostName }}"
        echo "Verify API routing: curl -sI \"https://${{ steps.deploy.outputs.frontDoorEndpointHostName }}/broker/api/v1/authentication/me\""
        echo "Expect Content-Type: application/json (not text/html)."

    - name: Logout from azure
      shell: bash
      if: ${{ failure() || success() }}
      continue-on-error: true
      run: az logout
