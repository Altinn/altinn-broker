name: Test Performance On Environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run against'
        required: true
        default: 'performance'
        type: choice
        options:
          - performance
          - use-case-test
          - use-case-staging
          - use-case-production
      test:
        description: 'Load test to run'
        required: true
        default: 'load'
        type: choice
        options:
          - load
          - rate-limit
          - range-download
      vus:
        description: 'Number of virtual users (load test only)'
        required: false
        default: '20'
        type: string
      duration:
        description: 'Test duration, e.g. 10m, 2m (load test only)'
        required: false
        default: '10m'
        type: string
  workflow_call:
    inputs:
      environment:
        description: 'Environment to run against'
        required: true
        type: string
      test:
        description: 'Load test to run (load | rate-limit | range-download)'
        required: false
        default: 'load'
        type: string
      vus:
        description: 'Number of virtual users (load test only)'
        required: false
        default: '20'
        type: string
      duration:
        description: 'Test duration, e.g. 10m, 2m (load test only)'
        required: false
        default: '10m'
        type: string

run-name: Test ${{ inputs.test || 'load' }} performance for environment ${{ inputs.environment }}

jobs:
  performance-test:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.test == 'range-download' && 180 || 60 }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Resolve load test script
      id: resolve
      run: |
        case "${TEST}" in
          load)
            echo "filename=tests/Altinn.Broker.LoadTests/test.js" >> "$GITHUB_OUTPUT"
            echo "flags=--vus ${VUS} --duration ${DURATION}" >> "$GITHUB_OUTPUT"
            ;;
          rate-limit)
            echo "filename=tests/Altinn.Broker.LoadTests/test-rate-limit.js" >> "$GITHUB_OUTPUT"
            echo "flags=" >> "$GITHUB_OUTPUT"
            ;;
          range-download)
            echo "filename=tests/Altinn.Broker.LoadTests/test-range-download.js" >> "$GITHUB_OUTPUT"
            echo "flags=" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "Unknown test '${TEST}'. Expected load, rate-limit, or range-download." >&2
            exit 1
            ;;
        esac
      env:
        TEST: ${{ inputs.test || 'load' }}
        VUS: ${{ inputs.vus || '20' }}
        DURATION: ${{ inputs.duration || '10m' }}

    - name: Run performance tests
      id: performance-test
      uses: grafana/k6-action@e4714b734f2b0afaabeb7b4a69142745548ab9ec # v0.3.1
      env:
        base_url: ${{ secrets.BROKER_BASE_URL }}
        mp_client_id: ${{ secrets.BRUKSMONSTER_MASKINPORTEN_CLIENT_ID }}
        mp_kid: ${{ secrets.BRUKSMONSTER_MASKINPORTEN_KID }}
        mp_client_pem: ${{ secrets.BRUKSMONSTER_MASKINPORTEN_PEM }}
        recipient: ${{ secrets.BRUKSMONSTER_RECIPIENT }}
        sender: ${{ secrets.BRUKSMONSTER_SENDER }}
      with:
        filename: ${{ steps.resolve.outputs.filename }}
        flags: ${{ steps.resolve.outputs.flags }}

    - name: Build failure report
      if: failure() && steps.performance-test.outcome == 'failure'
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        TEST: ${{ inputs.test }}
      run: |
          report=":warning: Broker performance test failure :warning: \n"
          report+="\n Environment: ${ENVIRONMENT}"
          report+="\n Test: ${TEST}"
          report+="\n Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "stepreport=$report" >> $GITHUB_ENV

    - name: Report failure to Slack
      if: failure() && steps.performance-test.outcome == 'failure'
      id: slack
      uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
      with:
        webhook-type: incoming-webhook
        webhook: ${{ secrets.BRUKSMONSTER_SLACK_URL || secrets.SLACK_URL }}
        payload: |
          {
            "text": "${{ env.stepreport }}"
          }
